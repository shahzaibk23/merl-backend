{% extends 'base.html' %}

<style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");


body {
  font-family: "Inter", sans-serif;
}

:root {
    --light: #ffe6e6;
    --dark: #0c0c0c;
  }

.tab-section .containerr {
  --bg-color: radial-gradient(
  	circle at 50% 0%,
  	rgba(50, 50, 50, 1) 0%,
  	rgba(12, 12, 12, 1) 100%
  );
  overflow: clip;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem 5rem;
  width: 100%;
  height: 100dvh;
  background-image: var(--bg-color);
  margin-top: 10vh;
  color: white;
}

.tab-section .category_container {
  --gap: 0.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: nowrap;
  overflow-x: scroll;
  padding-bottom: 50px;
  gap: calc(var(--gap) * 4);
  width: 100%;
  height: 100%;
}

.tab-section .content {
  --active: 0;
  cursor: pointer;
  overflow: clip;
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 1.5rem;
  padding: 2.5rem;
  width: calc((100% / 3) - var(--gap));
  height: 100%;
  border-radius: 1rem;
  transition: width 0.5s ease-in-out;
}

.tab-section .content:hover {
  --active: 1;
  width: calc(70% - var(--gap));
}

.tab-section .content::before {
  content: "";
  position: absolute;
  z-index: -10;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: var(--dark);
  opacity: 0.6;
}

.tab-section .content img {
  position: absolute;
  z-index: -20;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: center;
     object-position: center;
}

.tab-section .content .profile_image {
  opacity: calc(1 - var(--active));
  transition: opacity 0.3s ease-in-out;
}

.tab-section .profile_detail {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  width: 12rem;
  transition: transform 0.5s cubic-bezier(0.23, 0.93, 0.77, 1) 0.01s;
}

.tab-section .profile_detail span {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--light);
  text-wrap: nowrap;
}

.tab-section .profile_detail p {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--light);
}

.tab-section .profile_quote {
  width: 96%;
  padding-right: 4%;
  text-align: justify;
  overflow-y: scroll;
  transform: translate(0, calc((1 - var(--active)) * (100% + 2.5rem)));
}

.tab-section .profile_quote p {
  font-size: 1rem;
  font-weight: 600;
  color: var(--light);
  transform: translate(0, calc((1 - var(--active)) * (100% + 2.5rem)));
  transition: transform 0.5s cubic-bezier(0.23, 0.93, 0.77, 1) 0.1s;
}

.tab-section .wrapper {
  display: grid;
  grid-template-rows: 0fr;
  overflow: hidden;
  transition: grid-template-rows 0.5s cubic-bezier(0.23, 0.93, 0.77, 1) 0.01s;
  transition: grid-template-rows 0.5s cubic-bezier(0.23, 0.93, 0.77, 1) 0.01s, -ms-grid-rows 0.5s cubic-bezier(0.23, 0.93, 0.77, 1) 0.01s;
}

.tab-section .profile_quote {
  min-height: 0;
  transform: translateY(50%);
  opacity: 0;
  transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.23, 0.93, 0.77, 1) 0.01s;
}

.tab-section .content:hover .wrapper {
  grid-template-rows: 1fr;
}

.tab-section .content:hover .profile_quote {
  transform: none;
  opacity: 1;
}

.tab-section dialog {
  position: absolute;
  z-index: 1;
  background: none;
  color: white;
  border: 0;
  font-size: 0.8rem;
  padding: 0.5em;
}

.tab-section dialog a {
  color: whitesmoke;
}
</style>
